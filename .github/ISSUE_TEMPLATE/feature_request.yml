name: 功能建议
description: 描述要解决的使用问题和预期行为。
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用问题
      description: 描述具体场景，无需提供私人账号或站点数据。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的方案
