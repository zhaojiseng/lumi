name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:electron
      - name: Configure Chromium sandbox on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run check:secrets
      - run: npm run check:history
      - run: npm run typecheck
      - run: npm run check:extensions
      - name: Test with a virtual display on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Test on Windows and macOS
        if: runner.os != 'Linux'
        run: npm test
      - run: npm run build
      - run: npm audit
